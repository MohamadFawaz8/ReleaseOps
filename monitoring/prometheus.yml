global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: releaseops-local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: releaseops-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
  - job_name: releaseops-worker
    metrics_path: /metrics
    static_configs:
      - targets: [worker:8001]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
