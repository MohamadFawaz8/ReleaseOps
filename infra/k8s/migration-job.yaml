apiVersion: batch/v1
kind: Job
metadata:
  name: releaseops-migrate
  namespace: releaseops
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: releaseops-workload
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: releaseops-api:0.1.0
          imagePullPolicy: IfNotPresent
          command: [/app/.venv/bin/python, -m, app.migrate]
          envFrom:
            - configMapRef:
                name: releaseops-runtime
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: releaseops-db
                  key: database-url
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
