name: releaseops

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-releaseops}
      POSTGRES_USER: ${POSTGRES_USER:-releaseops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/local-secrets.sh to create .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 768m
    restart: unless-stopped
    networks: [backend]

  redis:
    image: redis:8-alpine
    command: [redis-server, --save, "60", "1", --appendonly, "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 256m
    restart: unless-stopped
    networks: [backend]

  migrate:
    image: releaseops-api:${APP_VERSION:-0.1.0}
    build:
      context: .
      target: runtime
    command: [python, -m, app.migrate]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-releaseops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-releaseops}
    depends_on:
      db: {condition: service_healthy}
    networks: [backend]
    restart: "no"

  api:
    image: releaseops-api:${APP_VERSION:-0.1.0}
    build: {context: ., target: runtime}
    command: [python, -m, uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-releaseops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-releaseops}
      REDIS_URL: redis://redis:6379/0
      APP_VERSION: ${APP_VERSION:-0.1.0}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
      WORKER_PROCESS_SECONDS: ${WORKER_PROCESS_SECONDS:-3}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    mem_limit: 512m
    stop_grace_period: 20s
    restart: unless-stopped
    networks: [backend]

  worker:
    image: releaseops-api:${APP_VERSION:-0.1.0}
    build: {context: ., target: runtime}
    command: [python, -m, app.worker]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-releaseops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-releaseops}
      REDIS_URL: redis://redis:6379/0
      APP_VERSION: ${APP_VERSION:-0.1.0}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
      WORKER_PROCESS_SECONDS: ${WORKER_PROCESS_SECONDS:-3}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    mem_limit: 384m
    stop_grace_period: 20s
    restart: unless-stopped
    networks: [backend]

  web:
    image: releaseops-web:${APP_VERSION:-0.1.0}
    build: {context: ., dockerfile: docker/web.Dockerfile}
    ports: ["${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_BIND_PORT:-8080}:8080"]
    depends_on: [api]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 96m
    restart: unless-stopped
    networks: [backend]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=7d, --web.enable-lifecycle]
    volumes: [./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro, ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro, prometheus_data:/prometheus]
    ports: ["127.0.0.1:9090:9090"]
    mem_limit: 512m
    networks: [backend]

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run scripts/local-secrets.sh to create .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/provisioning/dashboards/releaseops.json:/var/lib/grafana/dashboards/releaseops.json:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
    mem_limit: 384m
    networks: [backend]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [monitoring]
    command: [--config.file=/etc/alertmanager/alertmanager.yml]
    volumes: [./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro]
    ports: ["127.0.0.1:9093:9093"]
    mem_limit: 128m
    networks: [backend]

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  backend:
    driver: bridge
