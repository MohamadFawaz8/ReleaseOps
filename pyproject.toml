[project]
name = "releaseops"
version = "0.1.0"
description = "A containerized order-processing platform with asynchronous fulfillment."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.161.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.8",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
