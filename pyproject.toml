[project]
name = "releaseops"
version = "0.1.0"
description = "A small service for the ReleaseOps DevOps learning project."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.161.1",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
